<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Auto Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            margin-bottom: 20px;
        }

        .price {
            font-size: 1.2rem;
            font-weight: bold;
            color: #28a745;
        }

        .modal-header {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container mt-4">
        <h1 class="text-center">Auto Marketplace</h1>

        <!-- Add Car Button -->
        <div class="text-center mb-3">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCarModal">
                Add New Car
            </button>
        </div>

        <!-- Bootstrap Modal -->
        <div class="modal fade" id="addCarModal" tabindex="-1" aria-labelledby="addCarModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="addCarModalLabel">Add a New Car</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="addCarForm" method="post">
                            <div class="mb-3">
                                <label class="form-label">Car Model</label>
                                <input type="text" class="form-control" name="model" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Car Type</label>
                                <select class="form-control" name="type" required>
                                    <option value="SUV">SUV</option>
                                    <option value="Sedan">Sedan</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Color</label>
                                <input type="text" class="form-control" name="color" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Speed (km/h)</label>
                                <input type="number" class="form-control" name="speed" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Regular Price (₹)</label>
                                <input type="number" class="form-control" name="regularPrice" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Fuel Type</label>
                                <select class="form-control" name="fuelType" required>
                                    <option value="Petrol">Petrol</option>
                                    <option value="Diesel">Diesel</option>
                                    <option value="Electric">Electric</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Transmission</label>
                                <select class="form-control" name="transmission" required>
                                    <option value="Manual">Manual</option>
                                    <option value="Automatic">Automatic</option>
                                </select>
                            </div>

                            <!-- SUV Specific Fields -->
                            <div id="suvFields" style="display: none;">
                                <div class="mb-3">
                                    <label class="form-label">Weight (kg)</label>
                                    <input type="number" class="form-control" name="weight">
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="is4wd">
                                    <label class="form-check-label">4-Wheel Drive</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="hasThirdRowSeat">
                                    <label class="form-check-label">Third Row Seat</label>
                                </div>
                            </div>

                            <!-- Sedan Specific Fields -->
                            <div id="sedanFields" style="display: none;">
                                <div class="mb-3">
                                    <label class="form-label">Year</label>
                                    <input type="number" class="form-control" name="year">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Manufacturer Discount (₹)</label>
                                    <input type="number" class="form-control" name="manufacturerDiscount">
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="hasSunroof">
                                    <label class="form-check-label">Sunroof</label>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success w-100">Save Car</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Car Listings -->
        <div class="row">
            <div th:each="car : ${cars}" class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${car.color + ' ' + car.model}"></h5>
                        <p class="card-text" th:text="${car.getDescription()}"></p>
                        <span class="badge bg-success" th:if="${car instanceof T(com.vehicle.car.model.SUV)}">SUV</span>
                        <span class="badge bg-primary" th:if="${car instanceof T(com.vehicle.car.model.Sedan)}">Sedan</span>
                        <p class="price" th:text="'₹' + ${car.getRegularPrice()}"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelector('select[name="type"]').addEventListener('change', function() {
            let selectedType = this.value;
            document.getElementById('suvFields').style.display = (selectedType === 'SUV') ? 'block' : 'none';
            document.getElementById('sedanFields').style.display = (selectedType === 'Sedan') ? 'block' : 'none';
        });

        // AJAX Form Submission
        document.getElementById('addCarForm').addEventListener('submit', function(event) {
            event.preventDefault();

            let formData = new URLSearchParams(new FormData(this));

            fetch('/api/cars/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            })
            .then(response => {
                if (!response.ok) throw new Error("Error adding car.");
                return response.json();
            })
            .then(data => {
                alert("Car added successfully!");
                location.reload();
            })
            .catch(error => {
                console.error('Error:', error);
                alert("Failed to add car.");
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
