<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Car Dealership | Null Pointers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="navbar-content">
            <div class="team-name">Null Pointers</div>
        </div>
    </nav>
    <div class="container mt-4">
        <h1 class="text-center">Vehicle Collection</h1>

        <div th:if="${success}" class="alert alert-success" role="alert">
            <span th:text="${success}"></span>
        </div>

        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>

        <div class="text-center mb-3">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCarModal">
                Add New Car
            </button>
        </div>

        <div class="modal fade" id="addCarModal" tabindex="-1" aria-labelledby="addCarModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="addCarModalLabel">Add a New Car</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="addCarForm" action="/api/cars/add" method="post">
                            <div class="mb-3">
                                <label class="form-label">Car Model</label>
                                <input type="text" class="form-control" name="model" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Car Type</label>
                                <select class="form-control" name="type" required id="carType">
                                    <option value="">Select Type</option>
                                    <option value="SUV">SUV</option>
                                    <option value="Sedan">Sedan</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Color</label>
                                <input type="text" class="form-control" name="color" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Speed (km/h)</label>
                                <input type="number" class="form-control" name="speed" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Regular Price (₹)</label>
                                <input type="number" class="form-control" name="regularPrice" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Fuel Type</label>
                                <select class="form-control" name="fuelType" required>
                                    <option value="Petrol">Petrol</option>
                                    <option value="Diesel">Diesel</option>
                                    <option value="Electric">Electric</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Transmission</label>
                                <select class="form-control" name="transmission" required>
                                    <option value="Manual">Manual</option>
                                    <option value="Automatic">Automatic</option>
                                </select>
                            </div>

                            <div id="suvFields" class="type-specific-fields" style="display: none;">
                                <div class="mb-3">
                                    <label class="form-label">Weight (kg)</label>
                                    <input type="number" class="form-control" name="weight">
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="is4wd">
                                    <label class="form-check-label">4-Wheel Drive</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="hasThirdRowSeat">
                                    <label class="form-check-label">Third Row Seat</label>
                                </div>
                            </div>

                            <div id="sedanFields" class="type-specific-fields" style="display: none;">
                                <div class="mb-3">
                                    <label class="form-label">Year</label>
                                    <input type="number" class="form-control" name="year">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Manufacturer Discount (₹)</label>
                                    <input type="number" class="form-control" name="manufacturerDiscount">
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="hasSunroof">
                                    <label class="form-check-label">Sunroof</label>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success w-100">Save Car</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>


        <!-- <div class="car-section">
            <div id="sedans-list" class="car-list"></div>
            <div id="suvs-list" class="car-list"></div>
        </div> -->
        <div class="row">
            <div th:each="car : ${cars}" class="col-md-4">
                <div class="card">
                    <!-- <img th:src="@{/images/{image}(image=${car.image})}" alt="Car Image" class="car-image"> -->
                    <div class="card-body">
                        <h3 class="card-title">
                            
                             <strong th:text="${car.model}"></strong>
                        </h3>
                    
                        <p class="card-text">
                            📝 <strong>Description:</strong> <span th:text="${car.getDescription()}"></span><br>
                                <span>🎨 Color:</span> <strong th:text="${car.color}"></strong> 
                        </p>
                    
                        <!-- Price Tag -->
                        <p class="price">
                            💰 <strong>Price:</strong> ₹<span th:text="${car.getSalePrice()}"></span><br>
                                <span class="old-price">🔻 <strong>Old Price:</strong> ₹<span th:text="${car.getRegularPrice()}"></span></span>
                        </p>
                    
                        
                    </div>
                    
                </div>
            </div>
        </div>

    </div>

    <script src="/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
